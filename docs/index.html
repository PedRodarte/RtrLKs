<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Achei uma criança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
<link rel="stylesheet" href="estilo.css">
<style>
/* Página do QR: urgência (faixa vermelha) + tranquilidade (cartão verde) + um botão principal */
body { padding-top: 0; }
.banner {
  /* ocupa a largura toda da tela, mesmo dentro do main centralizado */
  width: 100vw; margin-left: calc(50% - 50vw);
  padding: max(16px, env(safe-area-inset-top)) max(20px, calc(50vw - 15rem + 4px)) 16px;
  background: var(--urgent-bg); color: var(--urgent-fg);
}
/* Selo branco: o emoji vermelho não some sobre a faixa vermelha */
.badge { display: inline-block; background: #fff; border-radius: 10px; padding: 0 .12em; line-height: 1.25; }
.calm {
  background: var(--calm-bg); color: var(--calm-fg); border: 1px solid var(--calm-line);
  border-radius: 10px; padding: var(--space);
}
.calm.support { color: var(--calm-fg); }
.call { display: flex; flex-direction: column; gap: var(--space); }
.sep { border: 0; border-top: 1px solid var(--line); margin: 0; }
/* Status vazio não ocupa espaço */
.status:empty { display: none; }
</style>
</head>
<body>
<main>
  <header class="banner">
    <h1><span class="badge" aria-hidden="true">🚨</span> Criança perdida: obrigado por ajudar!</h1>
  </header>

  <p class="support calm">✅ Estamos procurando: fique parado aí ou chame a polícia.</p>

  <button id="btn-enviar" type="button" class="btn-primary">📍 Compartilhar localização</button>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <a id="link-wpp" class="btn" href="#" hidden>Abrir o WhatsApp de novo</a>

  <div id="ligar" class="call" hidden>
    <hr class="sep">
    <p class="body">Você também pode ligar para o responsável:</p>
    <a id="tel-link" class="btn btn-outline" href="#"></a>
  </div>
</main>

<script src="envio.js"></script>
<script>
const tel = FindLK.telefone();
if (tel) {
  const link = document.getElementById("tel-link");
  link.href = tel.link;
  link.textContent = "📞 Ligar para " + tel.exibir;
  document.getElementById("ligar").hidden = false;
}

const btn = document.getElementById("btn-enviar");
btn.addEventListener("click", () => {
  btn.disabled = true;
  FindLK.enviar("", (codigo, texto) => {
    document.getElementById("status").textContent = texto;
    if (codigo !== "buscando") {
      btn.disabled = false;
      setTimeout(() => {
        const link = document.getElementById("link-wpp");
        link.href = FindLK.ultimaUrl();
        link.hidden = false;
      }, 0);
    }
  });
});
</script>
</body>
</html>
